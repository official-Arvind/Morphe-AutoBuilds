<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morphe Manager - Root Modules</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --primary-color: #38bdf8;
            --primary-hover: #0ea5e9;
            --secondary-color: #10b981;
            --on-bg: #f8fafc;
            --on-surface: #cbd5e1;
            --on-surface-muted: #94a3b8;
            --error-color: #ef4444;
            --success-color: #22c55e;
            --border-radius: 16px;
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            --transition: all 0.2s ease-in-out;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--on-bg);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            padding: 24px 20px;
            text-align: center;
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0) 100%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 14px;
            color: var(--on-surface-muted);
        }

        .tabs {
            display: flex;
            margin: 20px 20px 0;
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 4px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: calc(var(--border-radius) - 4px);
            font-weight: 600;
            font-size: 14px;
            color: var(--on-surface-muted);
            transition: var(--transition);
            user-select: none;
        }

        .tab.active {
            background-color: var(--primary-color);
            color: #0f172a;
        }

        .tab-content {
            display: none;
            padding: 20px;
            flex-grow: 1;
        }

        .tab-content.active { display: block; }

        /* Search Bar */
        .search-container {
            margin-bottom: 16px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            background-color: var(--surface-color);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--border-radius);
            color: var(--on-bg);
            font-size: 16px;
            transition: var(--transition);
            outline: none;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            opacity: 0.5;
            pointer-events: none;
        }

        .app-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 80px;
        }

        .module-card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .module-card:hover {
            background-color: var(--surface-hover);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .module-card.selected {
            border-color: var(--primary-color);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .module-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid var(--on-surface-muted);
            border-radius: 6px;
            outline: none;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .module-checkbox:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .module-checkbox:checked::after {
            content: '';
            position: absolute;
            left: 7px;
            top: 3px;
            width: 6px;
            height: 12px;
            border: solid #0f172a;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        .module-info { flex-grow: 1; min-width: 0; }
        
        .module-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--on-bg);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .module-details {
            font-size: 12px;
            color: var(--on-surface-muted);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .badge {
            background-color: rgba(255,255,255,0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .module-filename {
            font-size: 12px;
            color: var(--on-surface-muted);
            opacity: 0.7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
        }

        .btn {
            background-color: var(--primary-color);
            color: #0f172a;
            border: none;
            padding: 16px;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            transition: var(--transition);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn:disabled {
            background-color: var(--surface-color);
            color: var(--on-surface-muted);
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
        }
        
        .btn-secondary:hover:not(:disabled) {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--primary-hover);
        }

        .floating-action {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 560px;
            z-index: 100;
        }

        /* Settings */
        .settings-card {
            background-color: var(--surface-color);
            border-radius: var(--border-radius);
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .settings-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .settings-label { font-weight: 600; font-size: 16px; }
        .settings-desc { font-size: 13px; color: var(--on-surface-muted); margin-top: 4px; max-width: 80%; }

        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 48px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.1); transition: .3s; border-radius: 26px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px;
            background-color: #fff; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary-color); }
        input:checked + .slider:before { transform: translateX(22px); background-color: #0f172a; }

        input[type="time"] {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--on-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }
        
        input[type="time"]:focus {
            border-color: var(--primary-color);
        }

        /* Status & Loading */
        .status-box {
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .status-info { background-color: rgba(56, 189, 248, 0.1); color: var(--primary-color); border: 1px solid rgba(56, 189, 248, 0.2); }
        .status-success { background-color: rgba(34, 197, 94, 0.1); color: var(--success-color); border: 1px solid rgba(34, 197, 94, 0.2); }
        .status-error { background-color: rgba(239, 68, 68, 0.1); color: var(--error-color); border: 1px solid rgba(239, 68, 68, 0.2); }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: currentColor;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 40px;
            color: var(--on-surface-muted);
        }

        #loading .loading-spinner {
            width: 40px;
            height: 40px;
            border-top-color: var(--primary-color);
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--on-surface-muted);
            display: none;
        }
        
        .version-badge {
            display: inline-block;
            margin-top: 8px;
            font-size: 11px;
            padding: 2px 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            color: var(--on-surface-muted);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Morphe Manager</h1>
            <div class="subtitle">Root Module Installer</div>
            <div class="version-badge" id="appVersionBadge">v1.6</div>
        </header>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('modules', event)">Modules</div>
            <div class="tab" onclick="switchTab('settings', event)">Settings</div>
        </div>

        <!-- Modules Tab -->
        <div id="tab-modules" class="tab-content active">
            <div class="search-container">
                <svg class="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchInput" class="search-input" placeholder="Search modules..." oninput="filterModules()">
            </div>

            <div id="loading">
                <div class="loading-spinner"></div>
                <div>Fetching latest modules...</div>
            </div>
            
            <div id="emptyState" class="empty-state">
                <svg style="width: 48px; height: 48px; opacity: 0.5; margin-bottom: 12px; display: inline-block;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <div id="emptyStateMsg">No modules match your search.</div>
            </div>

            <div class="app-list" id="appList" style="display: none;"></div>
            
            <div id="status-modules" class="status-box"></div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content">
            <div class="settings-card">
                <div class="settings-row">
                    <div>
                        <div class="settings-label">Auto-Update Daemon</div>
                        <div class="settings-desc">Silently download and flash the latest root modules in the background.</div>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="autoUpdateToggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="settings-row" id="timeRow" style="opacity: 0.5; pointer-events: none;">
                    <div>
                        <div class="settings-label">Update Time</div>
                        <div class="settings-desc">Time to check for updates daily.</div>
                    </div>
                    <input type="time" id="updateTime" value="03:00">
                </div>
            </div>
            
            <button id="saveSettingsBtn" class="btn btn-secondary">Save Settings</button>
            <div id="status-settings" class="status-box"></div>
        </div>
        
        <!-- Floating Action Button -->
        <div class="floating-action" id="floatingAction" style="display: none;">
            <button id="installBtn" class="btn" disabled>Select Modules to Flash</button>
        </div>
    </div>

    <script>
        const REPO = 'official-Arvind/Morphe-AutoBuilds';
        let availableModules = [];
        let selectedUrls = new Set();
        
        function tryVibrate(ms) {
            try {
                if (navigator.vibrate) navigator.vibrate(ms);
            } catch(e) {}
        }

        function switchTab(tab, event) {
            tryVibrate(30);
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            if(tab === 'modules' && availableModules.length > 0) {
                document.getElementById('floatingAction').style.display = 'block';
            } else {
                document.getElementById('floatingAction').style.display = 'none';
            }
        }

        async function fetchLatestRelease() {
            try {
                const res = await fetch(`https://api.github.com/repos/${REPO}/releases/latest`);
                if (!res.ok) throw new Error("Failed to fetch GitHub release.");
                const release = await res.json();
                
                availableModules = release.assets.filter(asset => asset.name.endsWith('.zip') && !asset.name.includes('morphe-manager'));
                
                if (availableModules.length > 0) {
                    renderAppList(availableModules);
                    document.getElementById('floatingAction').style.display = 'block';
                } else {
                    showStatus('modules', 'No Magisk modules found in the latest release.', 'error');
                    document.getElementById('loading').style.display = 'none';
                }
            } catch (e) {
                showStatus('modules', `Network Error: ${e.message}`, 'error');
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        function formatBytes(bytes, decimals = 1) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB', 'PB', 'EB', 'ZB', 'YB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        function extractVersion(filename) {
            const match = filename.match(/-v([\d\.]+[\w\.\-\(\) ]*?)\.zip$/);
            return match ? "v" + match[1] : "Unknown Version";
        }
        
        function extractArch(filename) {
            if (filename.includes('arm64-v8a')) return 'arm64';
            if (filename.includes('armeabi-v7a')) return 'arm32';
            return 'universal';
        }

        function filterModules() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = availableModules.filter(mod => {
                const cleanName = (mod.name.split('-')[0] || mod.name).toLowerCase();
                return cleanName.includes(query) || mod.name.toLowerCase().includes(query);
            });
            renderAppList(filtered);
            
            if (filtered.length === 0 && availableModules.length > 0) {
                document.getElementById('emptyState').style.display = 'block';
                document.getElementById('appList').style.display = 'none';
            } else {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('appList').style.display = 'flex';
            }
        }

        function renderAppList(modulesToRender) {
            const listEl = document.getElementById('appList');
            listEl.innerHTML = '';
            
            modulesToRender.forEach(mod => {
                let baseName = mod.name.split('-universal')[0].split('-arm64')[0].split('-armeabi')[0];
                let cleanName = baseName.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                
                const version = extractVersion(mod.name);
                const arch = extractArch(mod.name);
                const size = formatBytes(mod.size);
                
                const isChecked = selectedUrls.has(mod.browser_download_url) ? 'checked' : '';
                const selectedClass = isChecked ? 'selected' : '';
                
                const card = document.createElement('label');
                card.className = `module-card ${selectedClass}`;
                card.innerHTML = `
                    <input type="checkbox" class="module-checkbox" value="${mod.browser_download_url}" onchange="tryVibrate(15); updateBtn(this)" ${isChecked}>
                    <div class="module-info">
                        <div class="module-name">${cleanName}</div>
                        <div class="module-details">
                            <span class="badge" style="background: rgba(16, 185, 129, 0.1); color: var(--secondary-color);">${version}</span>
                            <span class="badge">${arch}</span>
                            <span class="badge">${size}</span>
                        </div>
                        <div class="module-filename">${mod.name}</div>
                    </div>
                `;
                listEl.appendChild(card);
            });
            
            document.getElementById('loading').style.display = 'none';
            listEl.style.display = 'flex';
            updateBtn(null);
        }

        function updateBtn(checkboxElement) {
            if (checkboxElement) {
                const card = checkboxElement.closest('.module-card');
                if (checkboxElement.checked) {
                    card.classList.add('selected');
                    selectedUrls.add(checkboxElement.value);
                } else {
                    card.classList.remove('selected');
                    selectedUrls.delete(checkboxElement.value);
                }
            }

            const checkedCount = selectedUrls.size;
            const btn = document.getElementById('installBtn');
            if (checkedCount > 0) {
                btn.disabled = false;
                btn.innerText = `Patch & Install (${checkedCount}) Modules`;
            } else {
                btn.disabled = true;
                btn.innerText = "Select Modules to Flash";
            }
        }

        function showStatus(tab, message, type, sticky = false) {
            const box = document.getElementById(`status-${tab}`);
            box.className = `status-box status-${type}`;
            box.innerHTML = message;
            box.style.display = 'block';
            if (!sticky) {
                setTimeout(() => { box.style.display = 'none'; }, 5000);
            }
        }

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (selectedUrls.size === 0) return;
            const urls = Array.from(selectedUrls);
            
            const btn = document.getElementById('installBtn');
            btn.disabled = true;
            tryVibrate(50);
            btn.innerHTML = `<div class="loading-spinner"></div> Flashing... Please do not close`;
            
            const roasts = [
                "Downloading... if your internet isn't powered by a potato.",
                "Flashing... don't you dare touch that back button.",
                "Installing your shiny new modules. Hold your horses.",
                "Patching things up... hopefully you didn't pick anything conflicting.",
                "Doing the dirty work. Sit back and watch.",
                "Your modules are being flashed. Pray to the bootloop gods."
            ];
            const randomRoast = roasts[Math.floor(Math.random() * roasts.length)];
            
            showStatus('modules', `${randomRoast}<br><br><span style="opacity:0.8; font-size:12px;">Device will automatically reboot on success.</span>`, 'info', true);
            
            try {
                const res = await fetch('/cgi-bin/install.sh', {
                    method: 'POST',
                    body: JSON.stringify({ urls })
                });
                
                const text = await res.text();
                if (res.ok && text.includes("QUEUED")) {
                    showStatus('modules', "✨ Request queued! Starting background flasher...", 'success', true);
                    
                    const pollInterval = setInterval(async () => {
                        try {
                            const statusRes = await fetch('/cgi-bin/status.sh');
                            if (statusRes.ok) {
                                const statusText = await statusRes.text();
                                
                                if (statusText.includes("STATUS: SUCCESS")) {
                                    clearInterval(pollInterval);
                                    tryVibrate([50, 50, 50]);
                                    showStatus('modules', `✨ Flash successful! Device is rebooting...<br><pre style="margin-top:8px; font-size:11px; white-space:pre-wrap; background:rgba(0,0,0,0.2); padding:8px; border-radius:4px; max-height:150px; overflow-y:auto;">${statusText.trim()}</pre>`, 'success', true);
                                } else if (statusText.includes("STATUS: FAILURE")) {
                                    clearInterval(pollInterval);
                                    tryVibrate([100, 50, 100]);
                                    showStatus('modules', `🔥 Oof. That failed miserably. Here is why:<br><pre style="margin-top:8px; font-size:11px; white-space:pre-wrap; background:rgba(0,0,0,0.2); padding:8px; border-radius:4px; max-height:150px; overflow-y:auto;">${statusText.trim()}</pre>`, 'error', true);
                                    updateBtn(null);
                                } else if (statusText.trim() !== "" && statusText.trim() !== "WAITING") {
                                    // Live updates
                                    showStatus('modules', `<div style="display:flex; align-items:center; gap:8px;"><div class="loading-spinner" style="width:14px;height:14px;"></div> <b>Flashing in background...</b></div><pre id="liveLogs" style="margin-top:8px; font-size:11px; white-space:pre-wrap; background:rgba(0,0,0,0.2); padding:8px; border-radius:4px; max-height:150px; overflow-y:auto;">${statusText.trim()}</pre>`, '', true);
                                    // Auto scroll logs
                                    const logEl = document.getElementById('liveLogs');
                                    if(logEl) logEl.scrollTop = logEl.scrollHeight;
                                }
                            }
                        } catch (e) {
                            // ignore fetch errors during polling
                        }
                    }, 1000);
                } else {
                    tryVibrate([100, 50, 100]);
                    showStatus('modules', `🔥 Failed to queue request:<br><pre style="margin-top:8px; font-size:11px; white-space:pre-wrap; background:rgba(0,0,0,0.2); padding:8px; border-radius:4px;">${text.trim() || 'No logs.'}</pre>`, 'error', true);
                    updateBtn(null);
                }
            } catch (e) {
                tryVibrate([100, 50, 100]);
                showStatus('modules', `Communication error! Are you running this locally? Exception: ${e.message}`, 'error', true);
                updateBtn(null);
            }
        });

        const autoUpdateToggle = document.getElementById('autoUpdateToggle');
        const timeRow = document.getElementById('timeRow');
        
        autoUpdateToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                timeRow.style.opacity = '1';
                timeRow.style.pointerEvents = 'auto';
            } else {
                timeRow.style.opacity = '0.5';
                timeRow.style.pointerEvents = 'none';
            }
        });

        async function loadSettings() {
            try {
                const res = await fetch('/cgi-bin/config.sh?action=get');
                if (res.ok) {
                    const data = await res.json();
                    if (data.enabled === "true") {
                        autoUpdateToggle.checked = true;
                        timeRow.style.opacity = '1';
                        timeRow.style.pointerEvents = 'auto';
                    }
                    if (data.time) {
                        document.getElementById('updateTime').value = data.time;
                    }
                }
            } catch (e) { console.error("Could not load config", e); }
        }

        document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
            const btn = document.getElementById('saveSettingsBtn');
            btn.disabled = true;
            
            const enabled = autoUpdateToggle.checked;
            const time = document.getElementById('updateTime').value;
            
            try {
                const res = await fetch('/cgi-bin/config.sh', {
                    method: 'POST',
                    body: JSON.stringify({ action: "set", enabled: enabled.toString(), time: time })
                });
                if (res.ok) {
                    showStatus('settings', "Settings saved and background daemon updated successfully.", 'success');
                } else {
                    showStatus('settings', "Failed to save settings.", 'error');
                }
            } catch(e) {
                showStatus('settings', "Network error saving settings.", 'error');
            }
            btn.disabled = false;
        });

        fetchLatestRelease();
        loadSettings();
    </script>
</body>
</html>
